name: Check
on:
  push:
    branches: [main, rewrite]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { package_json_file: app/package.json }
      - uses: actions/setup-node@v5
        with: { node-version-file: app/.nvmrc, cache: pnpm, cache-dependency-path: app/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  website:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: website } }
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { package_json_file: app/package.json }
      - uses: actions/setup-node@v5
        with: { node-version-file: app/.nvmrc, cache: pnpm, cache-dependency-path: website/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
